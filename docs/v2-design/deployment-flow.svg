<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 750" role="img" aria-labelledby="deployment-title deployment-desc"><title id="deployment-title">Deployment and improvement flow</title><desc id="deployment-desc">Plan the work. Use OEM configuration or a model training route as needed. Test the release and prepare the site. Run a supervised pilot, review measured results, then improve or scale.</desc><defs><marker id="deployment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5c797d"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" fill="#15343b"><path d="M390 86 H440" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M800 86 H850" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M800 113 H825 V271 H850" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M1210 86 H1235 V370 H620 V400" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M1030 327 V370 H620 V400" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M440 456 H390" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M210 512 V595" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M390 651 H440" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M800 651 H850" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)"/><path d="M620 595 V560 H14 V15 H210 V30" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#deployment-arrow)" stroke-dasharray="6 5"/><text x="32" y="553" font-size="13" fill="#4d6266">Revise and retest</text><rect x="30" y="30" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="58" font-size="17" font-weight="700">1. Plan deployment</text><text x="48" y="83" font-size="14">Selected process, configuration, team,</text><text x="48" y="103" font-size="14">site changes, interfaces, and tests</text><rect x="440" y="30" width="360" height="112" rx="12" fill="#fff3d9" stroke="#d2ae54" stroke-width="1.5"/><text x="458" y="58" font-size="17" font-weight="700">2. Select the execution route</text><text x="458" y="83" font-size="14">AWS, OEM, and integrator define the route.</text><text x="458" y="103" font-size="14">Use one or both paths below.</text><rect x="850" y="30" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="868" y="58" font-size="17" font-weight="700">3a. Configure the solution</text><text x="868" y="83" font-size="14">OEM software, tools, workflow, maps,</text><text x="868" y="103" font-size="14">interfaces, and operating limits</text><rect x="850" y="215" width="360" height="112" rx="12" fill="#edf0f8" stroke="#9caacc" stroke-width="1.5"/><text x="868" y="243" font-size="17" font-weight="700">3b. Adapt or train if required</text><text x="868" y="268" font-size="14">Data, labels, simulation assets, policy/model,</text><text x="868" y="288" font-size="14">training runs, and failure tests</text><rect x="440" y="400" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="458" y="428" font-size="17" font-weight="700">4. Test the release and site</text><text x="458" y="453" font-size="14">Supported hardware and software version,</text><text x="458" y="473" font-size="14">acceptance tests, fallback, and support</text><rect x="30" y="400" width="360" height="112" rx="12" fill="#fff3d9" stroke="#d2ae54" stroke-width="1.5"/><text x="48" y="428" font-size="17" font-weight="700">5. Review pilot readiness</text><text x="48" y="453" font-size="14">A person records the site decision.</text><text x="48" y="473" font-size="14">Open issues can require a revised plan.</text><rect x="30" y="595" width="360" height="112" rx="12" fill="#edf0f8" stroke="#9caacc" stroke-width="1.5"/><text x="48" y="623" font-size="17" font-weight="700">6. Run the supervised pilot</text><text x="48" y="648" font-size="14">Load and check supported hardware.</text><text x="48" y="668" font-size="14">Measure real process and cost results.</text><rect x="440" y="595" width="360" height="112" rx="12" fill="#fff3d9" stroke="#d2ae54" stroke-width="1.5"/><text x="458" y="623" font-size="17" font-weight="700">7. Review and improve</text><text x="458" y="648" font-size="14">Compare with the agreed baseline.</text><text x="458" y="668" font-size="14">Change, stop, roll back, or accept.</text><rect x="850" y="595" width="360" height="112" rx="12" fill="#e9f4f1" stroke="#87b6a5" stroke-width="1.5"/><text x="868" y="623" font-size="17" font-weight="700">8. Operate and scale</text><text x="868" y="648" font-size="14">Track assets, releases, work, and benefit.</text><text x="868" y="668" font-size="14">Check each new site before reuse.</text><text x="30" y="740" font-size="14">Version 2 shows the full route. Real training, hardware loading, and physical robot control remain external integrations.</text></g></svg>