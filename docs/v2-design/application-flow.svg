<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1135" role="img" aria-labelledby="main-title main-desc"><title id="main-title">Proposed application flow</title><desc id="main-desc">Demand and supply meet at action matching. Process and fleet evaluation feeds economics and a decision. Deployment and field results feed the next evaluation.</desc><defs><marker id="main-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5c797d"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif" fill="#15343b"><path d="M210 142 V205" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M1030 142 V205" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M390 261 H440" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M850 261 H800" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M620 317 V400" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M390 456 H440" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M800 456 H850" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M1030 400 V317" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M620 512 V595" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M440 651 H390" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M210 707 V790" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M390 846 H440" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M800 846 H850" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><text x="797" y="832" font-size="13" fill="#4d6266">Proceed</text><path d="M620 902 V950 H210 V985" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><text x="350" y="942" font-size="13" fill="#4d6266">Defer or stop</text><path d="M1030 902 V985" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)"/><path d="M620 790 V755 H14 V175 H210 V205" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)" stroke-dasharray="6 5"/><text x="28" y="748" font-size="13" fill="#4d6266">Revise or collect data</text><path d="M1030 1097 H1238 V175 H1030 V205" fill="none" stroke="#5c797d" stroke-width="2" marker-end="url(#main-arrow)" stroke-dasharray="6 5"/><text x="1080" y="1121" font-size="13" fill="#4d6266">Field evidence</text><rect x="30" y="30" width="360" height="112" rx="12" fill="#e9f4f1" stroke="#87b6a5" stroke-width="1.5"/><text x="48" y="58" font-size="17" font-weight="700">1. Define the demand</text><text x="48" y="83" font-size="14">Process, actions, timing, demand, layout,</text><text x="48" y="103" font-size="14">engineering model, people, and cost</text><rect x="850" y="30" width="360" height="112" rx="12" fill="#e9f4f1" stroke="#87b6a5" stroke-width="1.5"/><text x="868" y="58" font-size="17" font-weight="700">2. Define the supply</text><text x="868" y="83" font-size="14">Products, complete configurations, limits,</text><text x="868" y="103" font-size="14">performance evidence, and prices</text><rect x="30" y="205" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="233" font-size="17" font-weight="700">3. Check the human baseline</text><text x="48" y="258" font-size="14">Check actions, units, sources, and gaps.</text><text x="48" y="278" font-size="14">Record skills and capability needs.</text><rect x="440" y="205" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="458" y="233" font-size="17" font-weight="700">5. Match actions and products</text><text x="458" y="258" font-size="14">Show supported, blocked, and unknown.</text><text x="458" y="278" font-size="14">Check valid work bundles and conditions.</text><rect x="850" y="205" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="868" y="233" font-size="17" font-weight="700">4. Check the configuration</text><text x="868" y="258" font-size="14">Record hardware, tool, software, source,</text><text x="868" y="278" font-size="14">test conditions, and missing evidence.</text><rect x="30" y="400" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="428" font-size="17" font-weight="700">6a. Keep alternative methods</text><text x="48" y="453" font-size="14">Current work, improved manual work,</text><text x="48" y="473" font-size="14">assist tools, and other automation</text><rect x="440" y="400" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="458" y="428" font-size="17" font-weight="700">6. Design the hybrid process</text><text x="458" y="453" font-size="14">Assign people and machines to actions.</text><text x="458" y="473" font-size="14">Include handoffs and recovery work.</text><rect x="850" y="400" width="360" height="112" rx="12" fill="#edf0f8" stroke="#9caacc" stroke-width="1.5"/><text x="868" y="428" font-size="17" font-weight="700">6b. Close evidence gaps</text><text x="868" y="453" font-size="14">Request a benchmark, simulation, or trial.</text><text x="868" y="473" font-size="14">The required evidence is an open choice.</text><rect x="440" y="595" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="458" y="623" font-size="17" font-weight="700">7. Evaluate process and fleet</text><text x="458" y="648" font-size="14">Check robot counts, human time, charge,</text><text x="458" y="668" font-size="14">failures, peaks, and the bottleneck.</text><rect x="30" y="595" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="623" font-size="17" font-weight="700">8. Calculate the business case</text><text x="48" y="648" font-size="14">Cost, staffing, retained cash benefit,</text><text x="48" y="668" font-size="14">payback, and scenario stress tests</text><rect x="30" y="790" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="818" font-size="17" font-weight="700">9. Compare and recommend</text><text x="48" y="843" font-size="14">Explain feasibility, economics, evidence,</text><text x="48" y="863" font-size="14">gaps, and the next action.</text><rect x="440" y="790" width="360" height="112" rx="12" fill="#fff3d9" stroke="#d2ae54" stroke-width="1.5"/><text x="458" y="818" font-size="17" font-weight="700">10. Record the owner decision</text><text x="458" y="843" font-size="14">Proceed, change, test, defer, or stop.</text><text x="458" y="863" font-size="14">Keep the reviewed versions and reason.</text><rect x="850" y="790" width="360" height="112" rx="12" fill="#edf0f8" stroke="#9caacc" stroke-width="1.5"/><text x="868" y="818" font-size="17" font-weight="700">11. Prepare and run deployment</text><text x="868" y="843" font-size="14">Configure or train as required. Test.</text><text x="868" y="863" font-size="14">Prepare hardware and a supervised pilot.</text><rect x="850" y="985" width="360" height="112" rx="12" fill="#e9f4f1" stroke="#87b6a5" stroke-width="1.5"/><text x="868" y="1013" font-size="17" font-weight="700">12. Operate and improve</text><text x="868" y="1038" font-size="14">Compare expected and observed results.</text><text x="868" y="1058" font-size="14">Update evidence, process, and cost.</text><rect x="30" y="985" width="360" height="112" rx="12" fill="#ffffff" stroke="#ccd8dc" stroke-width="1.5"/><text x="48" y="1013" font-size="17" font-weight="700">Retain the case</text><text x="48" y="1038" font-size="14">Keep the reason for defer or stop.</text><text x="48" y="1058" font-size="14">Reopen when new evidence is available.</text><text x="440" y="1050" font-size="15" font-weight="600">Dashed lines: review and learning loops</text><text x="440" y="1074" font-size="14">A case can stop or request more data.</text><text x="440" y="1097" font-size="14">A positive cost result does not prove readiness.</text></g></svg>